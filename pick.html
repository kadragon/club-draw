<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 고르기 · Club Draw</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="pick-page">
    <div class="mesh" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Club&nbsp;Draw</span>
        <span class="eyebrow">상품 고르기</span>
      </div>
    </header>

    <main class="pick-main">
      <p id="pick-status" class="pick-status" role="status" aria-live="polite">불러오는 중…</p>

      <section id="pick-closed" class="card pick-closed" hidden>
        <h2 class="card-title">접수가 마감되었습니다</h2>
        <p class="hint">
          더 이상 제출하거나 수정할 수 없습니다.
          <span id="pick-closed-mine">아래는 이 기기에서 제출한 선택입니다.</span>
        </p>
      </section>

      <section id="pick-find" class="card" hidden>
        <h2 class="card-title">1. 본인 찾기</h2>
        <input
          id="pick-search"
          class="input"
          type="search"
          placeholder="이름 검색"
          autocomplete="off"
          aria-label="이름 검색"
        />
        <ul id="pick-results" class="list pick-results"></ul>
        <p id="pick-results-hint" class="hint">이름 일부를 입력하세요.</p>
      </section>

      <section id="pick-form" class="card" hidden>
        <div class="card-head">
          <h2 class="card-title">2. 상품 고르기</h2>
          <button id="pick-change" class="btn btn-ghost btn-sm" type="button">다른 이름</button>
        </div>
        <p class="pick-who"><span id="pick-name" class="pick-name"></span> 님</p>
        <p id="pick-count" class="hint"></p>
        <ol id="pick-prizes" class="list pick-prizes"></ol>
        <button id="pick-submit" class="btn btn-primary pick-submit" type="button">제출</button>
        <p id="pick-msg" class="hint" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="/src/pick.ts"></script>
  </body>
</html>
